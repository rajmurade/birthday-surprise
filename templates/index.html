<!DOCTYPE html>
<html>

<head>

    <title>Birthday Surprise</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(
                135deg,
                #ff9ecf,
                #ffd6e7,
                #cdb4db
            );

            overflow:hidden;
        }

        .box{
            text-align:center;
            padding:20px;
        }

        h1{

            font-size:3rem;

            color:white;

            margin-bottom:20px;

            text-shadow:
                0 0 10px white,
                0 0 20px white;

        }

        h2{

            font-size:5rem;

            color:#ffd700;

            font-weight:bold;

            margin-bottom:20px;

            text-shadow:
                0 0 10px #ffd700,
                0 0 20px #ffd700,
                0 0 40px #ffb700,
                0 0 60px #ffb700;

            animation:glow 2s infinite alternate;

        }

        p{

            color:white;

            font-size:1.5rem;

            margin-bottom:40px;

        }

        button{

            padding:18px 40px;

            border:none;
            border-radius:50px;

            background:white;

            color:#ff4d88;

            font-size:22px;
            font-weight:bold;

            cursor:pointer;

            transition:.3s;
        }

        button:hover{

            transform:scale(1.1);

        }

        @keyframes glow{

            from{

                transform:scale(1);

                text-shadow:
                    0 0 10px #ffd700,
                    0 0 20px #ffd700,
                    0 0 40px #ffb700;

            }

            to{

                transform:scale(1.08);

                text-shadow:
                    0 0 20px #ffd700,
                    0 0 40px #ffd700,
                    0 0 60px #ffb700,
                    0 0 80px #ffb700;

            }

        }

        @media(max-width:768px){

            h1{
                font-size:2rem;
            }

            h2{
                font-size:3.5rem;
            }

            p{
                font-size:1.2rem;
            }

            button{
                font-size:18px;
                padding:15px 30px;
            }

        }

    </style>

</head>

<body>

<div class="box">

    <h1>🎂 HAPPY BIRTHDAY 🎂</h1>

    <h2>{{ name }} ✨</h2>

    <p>
        Today is all about you 💖
    </p>

    <a href="/celebrate">

        <button>
            Click For Your Surprise ✨
        </button>

    </a>

</div>

</body>

</html>
