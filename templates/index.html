<!DOCTYPE html>
<html>

<head>

    <title>Birthday Surprise</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(
                135deg,
                #ff9ecf,
                #ffd6e7,
                #cdb4db
            );

            overflow:hidden;
        }

        .box{
            text-align:center;
            padding:20px;
        }

        h1{
            font-size:4rem;
            color:white;

            text-shadow:
                0 0 15px white;

            animation:pulse 2s infinite;
        }

        .name{

            font-size:5rem;

            font-weight:bold;

            color:white;

            margin-top:25px;
            margin-bottom:20px;

            text-shadow:
                0 0 10px white,
                0 0 20px white,
                0 0 30px #ff69b4,
                0 0 50px #ff69b4;

            animation:glow 2s infinite alternate;
        }

        .message{
            color:white;
            font-size:1.5rem;
            margin-bottom:40px;
        }

        button{

            padding:18px 40px;

            border:none;
            border-radius:50px;

            background:white;
            color:#ff4d88;

            font-size:22px;
            font-weight:bold;

            cursor:pointer;

            transition:.3s;
        }

        button:hover{
            transform:scale(1.1);
        }

        @keyframes pulse{

            50%{
                transform:scale(1.05);
            }

        }

        @keyframes glow{

            from{
                text-shadow:
                    0 0 10px white,
                    0 0 20px white,
                    0 0 30px #ff69b4;
            }

            to{
                text-shadow:
                    0 0 20px white,
                    0 0 40px white,
                    0 0 60px #ff69b4;
            }

        }

        @media(max-width:768px){

            h1{
                font-size:2.5rem;
            }

            .name{
                font-size:3.5rem;
            }

            .message{
                font-size:1.2rem;
            }

        }

    </style>

</head>

<body>

<div class="box">

    <h1>🎂 HAPPY BIRTHDAY 🎂</h1>

    <div class="name">
        {{ name }} ✨
    </div>

    <div class="message">
        Today is all about you 💖
    </div>

    <a href="/celebrate">

        <button>
            Click For Your Surprise ✨
        </button>

    </a>

</div>

</body>

</html>
