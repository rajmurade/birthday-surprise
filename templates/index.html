<!DOCTYPE html>

<html>

<head>
    <title>Birthday Surprise</title>

```
<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;

        background:linear-gradient(
            135deg,
            #ffafcc,
            #ffc8dd,
            #cdb4db
        );
    }

    .card{

        width:90%;
        max-width:700px;

        background:white;

        padding:50px;

        border-radius:30px;

        text-align:center;

        box-shadow:
        0 20px 50px rgba(0,0,0,.15);

    }

    .emoji{
        font-size:60px;
        margin-bottom:20px;
    }

    .birthday{
        font-size:28px;
        color:#666;
        margin-bottom:10px;
        letter-spacing:3px;
    }

    .name{

        font-size:72px;
        font-weight:900;

        color:#ff4d88;

        margin-bottom:20px;

    }

    .message{

        font-size:22px;
        color:#555;

        margin-bottom:40px;

    }

    button{

        background:#ff4d88;
        color:white;

        border:none;

        padding:18px 45px;

        border-radius:50px;

        font-size:20px;
        font-weight:bold;

        cursor:pointer;

        transition:.3s;
    }

    button:hover{

        transform:translateY(-4px);

    }

    @media(max-width:768px){

        .card{
            padding:30px;
        }

        .name{
            font-size:48px;
        }

        .message{
            font-size:18px;
        }

    }

</style>
```

</head>

<body>

```
<div class="card">

    <div class="emoji">🎂🎉✨</div>

    <div class="birthday">
        HAPPY BIRTHDAY
    </div>

    <div class="name">
        {{ name }}
    </div>

    <div class="message">
        Someone made a little surprise just for you 💖
    </div>

    <a href="/celebrate">
        <button>
            Open Surprise 🎁
        </button>
    </a>

</div>
```

</body>
</html>
